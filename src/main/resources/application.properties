# Server Port
server.port=8081

# Spring Application Name
spring.application.name=smartlead

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartlead}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Always run "docker compose up", even if some services are already running
spring.docker.compose.start.skip=never

# RabbitMQ (connection details come from compose.yaml in dev)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:smartlead}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:smartlead}
# Failed qualifications are retried with backoff, then dead-lettered
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2

# Spring AI - Hugging Face router (OpenAI-compatible; Spring AI appends /v1/chat/completions)
spring.ai.openai.api-key=${SMARTLEAD_API_KEY}
spring.ai.openai.base-url=https://router.huggingface.co
spring.ai.openai.chat.options.model=meta-llama/Llama-3.3-70B-Instruct
spring.ai.openai.chat.options.temperature=0.1
# Only the chat model is used
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# RabbitMQ owns retries; rate limits (429) count as retryable
spring.ai.retry.max-attempts=1
spring.ai.retry.on-http-codes=429

# Email notifications for new leads. Defaults point at the Mailpit container from compose.yaml;
# set the SMTP_* variables to send through a real provider.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
smartlead.mail.from=${MAIL_FROM:SmartLead <notifications@smartlead.local>}
smartlead.dashboard-url=${DASHBOARD_URL:http://localhost:5173}
# A mail server outage should not mark the whole app as down
management.health.mail.enabled=false

# Authentication (set JWT_SECRET in production; the default is for local development only)
smartlead.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
smartlead.jwt.expires-in=24h

# Public form endpoint limits
smartlead.public-form.rate-limit-per-minute=10
smartlead.public-form.monthly-quota=500

# Swagger / OpenAPI Path
springdoc.swagger-ui.path=/swagger-ui.html