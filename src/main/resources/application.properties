# Server Port
server.port=8080

# Spring Application Name
spring.application.name=smartlead

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartlead}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Hugging Face AI Configuration
ai.huggingface.token=${SMARTLEAD_API_KEY}
ai.huggingface.base-url=https://router.huggingface.co/v1
ai.huggingface.model=meta-llama/Llama-3.3-70B-Instruct:groq

# Swagger / OpenAPI Path
springdoc.swagger-ui.path=/swagger-ui.html