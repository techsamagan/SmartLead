services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: smartlead
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5439:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: 'rabbitmq:4-management'
    environment:
      RABBITMQ_DEFAULT_USER: smartlead
      RABBITMQ_DEFAULT_PASS: smartlead
    ports:
      - '5672:5672'
      - '15672:15672'

volumes:
  pgdata: