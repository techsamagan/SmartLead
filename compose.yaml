services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: smartlead
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5439:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: 'rabbitmq:4-management'
    environment:
      RABBITMQ_DEFAULT_USER: smartlead
      RABBITMQ_DEFAULT_PASS: smartlead
    ports:
      - '5672:5672'
      - '15672:15672'

  # Local mail catcher: nothing leaves your machine, read the emails at http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata: